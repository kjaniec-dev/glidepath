[project]
name = "glidepath-core"
version = "0.1.0"
description = "Core Monte Carlo retirement-projection engine (numpy). Framework-agnostic, reusable by CLI / Streamlit / FastAPI."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "glidepath" }]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Optional Plotly charts shared by the Streamlit app and notebooks. The core
# engine itself never imports these — keeps the library lean.
viz = ["plotly>=5.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glidepath"]
