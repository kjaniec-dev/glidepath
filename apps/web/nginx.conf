server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /simulate and /health to the API container.
    # The React app is built with VITE_API_URL="" so it calls these as same-origin paths.
    location ~ ^/(simulate|health)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # SPA fallback: unknown paths serve index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
