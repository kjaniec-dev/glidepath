[project]
name = "glidepath-api"
version = "0.1.0"
description = "Stateless FastAPI service exposing the glidepath Monte Carlo engine via POST /simulate."
requires-python = ">=3.11"
dependencies = [
    "glidepath-core",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glidepath_api"]

[tool.uv.sources]
glidepath-core = { workspace = true }
